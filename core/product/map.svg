<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Restricted region illustration">
  <defs>
    <linearGradient id="globeRim" x1="135" y1="285" x2="765" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9146a"/>
      <stop offset="0.48" stop-color="#9a52ff"/>
      <stop offset="1" stop-color="#2476ff"/>
    </linearGradient>
    <linearGradient id="pinStroke" x1="386" y1="55" x2="516" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5aad"/>
      <stop offset="1" stop-color="#ff8fd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 236) rotate(90) scale(116 316)">
      <stop offset="0" stop-color="#ff4aa0" stop-opacity="0.62"/>
      <stop offset="0.22" stop-color="#ff4aa0" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#2476ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hotspot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 238) rotate(90) scale(36 110)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.12" stop-color="#ffd4ea" stop-opacity="0.92"/>
      <stop offset="0.34" stop-color="#ff4aa0" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#ff4aa0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globeClip">
      <path d="M118 312C206 189 315 158 450 158C585 158 694 189 782 312V420H118V312Z"/>
    </clipPath>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="bigBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .arc{filter:drop-shadow(0 0 10px rgba(255,72,161,.16));}
      .pinPulse{transform-origin:450px 112px;animation:pulse 2.8s ease-in-out infinite;}
      .softPulse{animation:softpulse 2.8s ease-in-out infinite;}
      .spark{animation:spark 2.8s ease-in-out infinite;}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.78}50%{transform:scale(1.04);opacity:1}}
      @keyframes softpulse{0%,100%{opacity:.45}50%{opacity:.9}}
      @keyframes spark{0%,100%{opacity:.92}50%{opacity:1}}
    </style>
  </defs>

  <ellipse class="softPulse" cx="450" cy="255" rx="330" ry="125" fill="url(#glow)" opacity="0.72"/>
  <ellipse class="softPulse" cx="450" cy="238" rx="78" ry="20" fill="#ff4aa0" opacity="0.14" filter="url(#bigBlur)"/>
  <ellipse class="softPulse" cx="450" cy="238" rx="112" ry="30" fill="url(#hotspot)" opacity="0.9"/>

