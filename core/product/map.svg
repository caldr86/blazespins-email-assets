    <path d="M450 205C450 205 520 135 520 84C520 46 489 20 450 20C411 20 380 46 380 84C380 135 450 205 450 205Z" fill="#e9146a" fill-opacity="0.08" stroke="url(#pinStroke)" stroke-width="5.5" stroke-linejoin="round"/>
